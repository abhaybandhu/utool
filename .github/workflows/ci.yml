name: C CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Create bin directory
      run: mkdir -p .bin

    - name: Compile tests
      run: |
        gcc -Wall -Wextra \
        tests/unitTest.c \
        tests/Unity/*.c \
        tests/unitTests/*.c \
        directive/*.c \
        -Iunity \
        -o .bin/unitTests

    - name: Run unit tests
      run: .bin/unitTests
